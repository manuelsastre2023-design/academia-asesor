<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Academia del asesor</title>
<style>
:root{--brand:#8a1a9b;--bg:#f2f1f4;--paper:#fff;--fg:#1d1622;--muted:#5f566a;--line:#e2dde7;--err:#a3261b}
@media (prefers-color-scheme:dark){:root{--brand:#c46fd3;--bg:#141017;--paper:#1d1721;--fg:#ece6f0;--muted:#a99db3;--line:#342b3b;--err:#ff8a7a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{width:100%;max-width:380px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:28px 24px}
.wm{font-weight:800;letter-spacing:.18em;font-size:12px;color:var(--brand);margin:0 0 6px}
h1{font-size:26px;line-height:1.15;margin:0 0 6px}
p.s{color:var(--muted);margin:0 0 20px;font-size:15px}
label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
input[type=password]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
input[type=password]:focus{outline:2px solid var(--brand);outline-offset:1px}
.rec{display:flex;gap:8px;align-items:center;font-weight:400;font-size:14px;margin:12px 0 18px;color:var(--muted)}
button{width:100%;font:inherit;font-weight:700;padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
#e{color:var(--err);font-size:14px;min-height:1.4em;margin:10px 0 0}
</style>
</head>
<body>
<form id="f">
<p class="wm">BLOOMMART</p>
<h1>Academia del asesor</h1>
<p class="s">Material de uso interno. Escribe la contraseña que te entregaron.</p>
<label for="p">Contraseña</label>
<input id="p" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
<label class="rec"><input type="checkbox" id="r"> Recordar en este equipo</label>
<button id="b">Entrar</button>
<p id="e" role="alert"></p>
</form>
